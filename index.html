<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NUMAL DAS · PORTFOLIO</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-screen="home">

<!-- Background art layers -->
<div id="bg" aria-hidden="true">
  <div class="bg-layer" id="bg-stripes"></div>
  <svg class="bg-star" style="left:6%;top:8%;width:26vmax;height:26vmax" viewBox="0 0 100 100">
    <polygon points="50,0 60,35 98,35 68,57 78,94 50,72 22,94 32,57 2,35 40,35" fill="#000"/>
  </svg>
  <svg class="bg-star s2" style="right:4%;bottom:6%;width:34vmax;height:34vmax" viewBox="0 0 100 100">
    <polygon points="50,0 60,35 98,35 68,57 78,94 50,72 22,94 32,57 2,35 40,35" fill="#fff"/>
  </svg>
  <!-- Per-screen menu artwork: assets/menus/<screen>.jpg
       Each falls back to the CSS stripes if its file is missing -->
  <img class="menu-art" id="art-home" src="assets/menus/home.jpg" alt=""
       onload="document.body.classList.add('has-art-home')" onerror="this.remove()">
  <img class="menu-art" id="art-projects" src="assets/menus/projects.jpg" alt=""
       onload="document.body.classList.add('has-art-projects')" onerror="this.remove()">
 <video class="menu-art" id="art-skills"
       autoplay muted loop playsinline
       onloadeddata="document.body.classList.add('has-art-skills')">
  <source src="assets/video/skills.mp4" type="video/mp4">
</video>
  <img class="menu-art" id="art-about" src="assets/menus/about.jpg" alt=""
       onload="document.body.classList.add('has-art-about')" onerror="this.remove()">
  <img class="menu-art" id="art-contact" src="assets/menus/contact.jpg" alt=""
       onload="document.body.classList.add('has-art-contact')" onerror="this.remove()">
  <div class="bg-layer" id="bg-halftone"></div>
  <div class="bg-layer" id="bg-vignette"></div>
</div>
<div id="slash" aria-hidden="true"></div>

<!-- Screen transition wipe -->
<div id="wipe" aria-hidden="true">
  <div class="pane p3"></div>
  <div class="pane p2"></div>
  <div class="pane p1"></div>
  <div class="flash"></div>
</div>

<!-- Custom animated cursor + select sound -->
<div id="cursor" aria-hidden="true"></div>
<audio id="sfx-select" src="assets/sfx/select.mp3" preload="auto"></audio>
<button id="audio-toggle" aria-label="Turn audio on">🔇</button>

<!-- Home background video: intro plays once, then the loop takes over -->
<div id="home-video-wrap" aria-hidden="true">

  <!-- Loop video (underneath). Started by the script when the intro ends -->
  <video id="home-video-loop" muted loop playsinline preload="auto">
    <source src="assets/video/home-background-loop.mp4" type="video/mp4">
  </video>

  <!-- Intro video (on top). Plays once, no loop -->
  <video id="home-video-intro" autoplay muted playsinline preload="auto">
    <source src="assets/video/home-background-intro.mp4" type="video/mp4">
  </video>

  <!-- Hologram overlay on top of the videos (desktop + mobile versions).
       Each image removes itself if its file is missing -->
  <div class="fv-overlay">
    <img alt="" class="particle v-pc" src="assets/imgs/hologram.webp" onerror="this.remove()">
    <img alt="" class="particle v-sp" src="assets/imgs/hologram_mobile.webp" onerror="this.remove()">
  </div>

</div>


<div id="shell">
  <div id="hud-top">
    <div class="hud-tag">Portfolio // NUMAL DAS</div>
    <div class="hud-tag alt">ASSAM · ELECTRONICS AND COMMUNICATION</div>
  </div>

  <div id="stage">

    <!-- HOME -->
    <section class="screen active" id="screen-home" aria-label="Main menu">
      <div id="intro-eyebrow">Take a look at my work</div>
      <h1 id="big-name">
        <span class="ransom" data-ransom="NUMAL"></span>
        <span class="ransom" data-ransom="DAS"></span>
      </h1>
      <p id="tagline">
       <p id="tagline">
  test
</p>
      </p>
      <nav id="menu" aria-label="Sections">
        <button class="menu-item sel" data-target="projects">
          <span class="ransom" data-ransom="PROJECTS"></span><span class="cursor-mark">◀</span>
        </button>
        <button class="menu-item" data-target="skills">
          <span class="ransom" data-ransom="SKILLS"></span><span class="cursor-mark">◀</span>
        </button>
        <button class="menu-item" data-target="about">
          <span class="ransom" data-ransom="ABOUT"></span><span class="cursor-mark">◀</span>
        </button>
        <button class="menu-item" data-target="contact">
          <span class="ransom" data-ransom="CONTACT"></span><span class="cursor-mark">◀</span>
        </button>
      </nav>
    </section>

    <!-- PROJECTS -->
    <section class="screen sub" id="screen-projects" aria-label="Projects">
      <div class="screen-head"><span class="ransom" data-ransom="PROJECTS"></span></div>
      <button class="back-hint" data-back>ESC · Back</button>
      <div class="grid-label"><span class="bar"></span>Featured</div>
      <div id="feat-grid" class="grid"></div>
      <div class="grid-label"><span class="bar"></span>All repositories</div>
      <div id="repo-status">Contacting GitHub…</div>
      <div id="repo-grid" class="grid"></div>
    </section>

    <!-- SKILLS -->
    <section class="screen sub" id="screen-skills" aria-label="Skills">
      <div class="screen-head"><span class="ransom" data-ransom="SKILLS"></span></div>
      <button class="back-hint" data-back>ESC · Back</button>
      <div id="skills-body"></div>
    </section>

    <!-- ABOUT -->
<section class="screen sub align-right" id="screen-about" aria-label="About">

  <div class="screen-head">
    <span class="ransom" data-ransom="ABOUT"></span>
  </div>

  <button class="back-hint" data-back>ESC · Back</button>

  <div class="paper">

    <!-- Profile photo -->
    <figure class="about-photo">
      <img src="assets/me.jpg" alt="Numal Das">
      <figcaption>NUMAL · ASSAM</figcaption>
    </figure>

    <!-- INTRODUCTION -->
    <p class="quote">
      test
    </p>

  </div>

  <!-- CV BUTTON -->
  <a class="cv-btn"
     href="assets/resume/sample.pdf"
     download="sample.pdf">
    <span>⬇ Download my CV (PDF)</span>
  </a>

</section>
    <!-- CONTACT -->
    <section class="screen sub align-right" id="screen-contact" aria-label="Contact">
      <div class="screen-head"><span class="ransom" data-ransom="CONTACT"></span></div>
      <button class="back-hint" data-back>ESC · Back</button>
      <div class="paper" style="max-width:620px">
        <p>test <strong>test </strong> test </p>
      </div>
      <div class="contact-list">
        <a class="contact-chip" href="mailto:closure@prts.live"><span>Email ✉</span></a>
        
        <a class="contact-chip" href="https://github.com/DrAnglerfish" target="_blank" rel="noopener"><span>GitHub ↗</span></a>
        
        <a class="contact-chip" href="https://www.instagram.com/dranglerfish/" target="_blank" rel="noopener"><span>Instagram ↗</span></a>
        
       <a class="contact-chip" href="assets/resume/sample.pdf" download="sample.pdf"><span>CV ⬇</span></a>
      </div>

      <!-- Message form — relayed to your inbox via formsubmit.co.
           NOTE: the first-ever submission emails you a one-time activation link. -->
      <form id="contact-form" class="paper" style="max-width:620px" novalidate>
        <div class="form-head">Send me a message</div>
        <label class="field">
          <span>Name</span>
          <input type="text" name="name" required maxlength="100" autocomplete="name">
        </label>
        <label class="field">
          <span>Your email</span>
          <input type="email" name="email" required maxlength="150" autocomplete="email">
        </label>
        <label class="field">
          <span>Message</span>
          <textarea name="message" required rows="5" maxlength="3000"></textarea>
        </label>
        <!-- honeypot: bots fill this, humans never see it -->
        <input type="text" name="_honey" tabindex="-1" autocomplete="off"
               style="position:absolute;left:-5000px" aria-hidden="true">
        <div class="form-foot">
          <button type="submit" class="cv-btn form-send"><span>Send it ➤</span></button>
          <div id="form-status" role="status"></div>
        </div>
      </form>
    </section>

  </div>

  <div id="hud-bottom">
    <span><span class="key">↑↓</span>Select</span>
    <span><span class="key">Enter</span>Confirm</span>
    <span><span class="key">Esc</span>Back</span>
    <span style="margin-left:auto;opacity:.8" id="clock"></span>
  </div>
</div>

<!-- MVC: model = data, view = DOM, controller = events -->
<script src="js/model.js" defer></script>
<script src="js/view.js" defer></script>
<script src="js/controller.js" defer></script>
</body>
</html>
